platform:
  name: northwind-support
  host: 127.0.0.1
  default_version: v1
llm:
  roles:
    decision: ${DECISION_LLM:-ollama:qwen3:4b}
    answer: ${ANSWER_LLM:-ollama:qwen3:4b}
    verifier: ${VERIFIER_LLM:-ollama:qwen3:4b}
  embeddings: ${EMBED_MODEL:-hash}
  providers:
    timeout_s: ${LLM_TIMEOUT_S:-180}
    ollama:
      host: ${OLLAMA_HOST:-http://localhost:11434}
stores:
  json:
    path: .state/json
  sqlite:
    path: .state/sqlite
  chroma:
    path: .state/chroma
  qdrant:
    url: ${QDRANT_URL:-http://localhost:6333}
  postgres:
    url: ${DATABASE_URL:-postgresql://support:support@localhost:5432/support}
  redis:
    url: ${REDIS_URL:-redis://localhost:6379/0}
services:
  gateway:
    kind: gateway
    port: 9100
    company: Northwind
    domain: customer support front door
    usecase: Decision AI that routes each customer message to the right specialist service over A2A.
    flow: gateway
    agents:
      router: strands
    transport: ${GATEWAY_TRANSPORT:-a2a}
    llm:
      decision: ${GATEWAY_DECISION_LLM:-${DECISION_LLM:-ollama:qwen3:4b}}
    routes_to:
    - billing
    - refunds
    - shipping
    - returns
    - tech_support
    - account_security
    - subscriptions
    - promotions
    - warranty
    - enterprise_sla
    - onboarding
    - privacy_gdpr
    - fraud
    - legal_compliance
    - loyalty
    - payments_failed
    - product_info
    - accessibility
    - complaints
    depends_on:
    - billing
    - refunds
    - shipping
    - returns
    - tech_support
    - account_security
    - subscriptions
    - promotions
    - warranty
    - enterprise_sla
    - onboarding
    - privacy_gdpr
    - fraud
    - legal_compliance
    - loyalty
    - payments_failed
    - product_info
    - accessibility
    - complaints
  support_tools:
    kind: mcp
    port: 9200
    usecase: MCP server exposing lookup_policy, lookup_record and escalate_to_human for every service.
    transport: streamable-http
    path: /mcp
  concierge:
    kind: adk_app
    port: 9300
    company: Northwind
    domain: concierge
    usecase: Google ADK concierge served by the ADK api server; hands customers to specialists through RemoteA2aAgent and uses MCP tools.
    app_name: northwind_concierge
    llm:
      decision: ${CONCIERGE_LLM:-${DECISION_LLM:-ollama:qwen3:4b}}
    routes_to:
    - billing
    - refunds
    - shipping
    - returns
    - tech_support
    - account_security
    - subscriptions
    - promotions
    - warranty
    - enterprise_sla
    - onboarding
    - privacy_gdpr
    - fraud
    - legal_compliance
    - loyalty
    - payments_failed
    - product_info
    - accessibility
    - complaints
    depends_on:
    - support_tools
    - billing
    - refunds
    - shipping
    - returns
    - tech_support
    - account_security
    - subscriptions
    - promotions
    - warranty
    - enterprise_sla
    - onboarding
    - privacy_gdpr
    - fraud
    - legal_compliance
    - loyalty
    - payments_failed
    - product_info
    - accessibility
    - complaints
